<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炸鸡日志回放器</title>
    <style>
        /* 整体布局 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* 搜索区域 */
        .search-area {
            margin-bottom: 10px;
            position: relative;
        }

        .search-area input {
            margin: 0 10px;
            padding: 5px;
        }

        .search-dropdown {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            width: calc(100% - 20px);
            z-index: 1000;
            display: none;
        }

        .search-dropdown.show {
            display: block;
        }

        .dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background-color: #f0f0f0;
        }

        /* 游戏列表区域 */
        .game-list {
            width: 300px;
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin-right: 20px;
            float: left;
        }

        .game-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .game-item:hover {
            background-color: #f0f0f0;
        }

        /* 状态列表区域 */
        .state-list {
            width: 300px;
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin-left: 20px;
            float: right;
        }

        .state-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .state-item:hover {
            background-color: #f0f0f0;
        }

        .state-item.active {
            background-color: #e0e0e0;
        }

        /* 牌桌样式 */
        .table {
            width: 1280px;
            height: 720px;
            background: url('skin/table.png');
            background-size: cover;
            position: relative;
            margin: 10px auto;
        }

        /* 轮次显示 */
        .round-info {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 10px;
        }

        /* 玩家区域 */
        .player {
            position: absolute;
            width: 450px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
        }

        .player-info {
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .player-0 { /* 下方玩家 */
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
        }

        .player-1 { /* 左侧玩家 */
            left: 10px;
            top: 35%;
            transform: translateY(-50%);
            transform-origin: left center;
        }

        .player-2 { /* 右侧玩家 */
            right: 10px;
            top: 35%;
            transform: translateY(-50%);
            transform-origin: right center;
            text-align: right;
        }

        /* 牌区域 */
        .card-area {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.8);
        }

        .hand-cards {
            background: rgba(0, 0, 255, 0.2);
        }

        .throw-cards {
            background: rgba(255, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        /* 左右玩家的牌区域特殊样式 */
        .player-1 .card-area, .player-2 .card-area {
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            max-width: 450px;
        }

        .card-area img {
            width: 45px;
            height: 63px;
            margin-left: -22.5px; /* 负边距使牌堆叠,覆盖50% */
        }

        .card-area img:first-child {
            margin-left: 0; /* 第一张牌不需要负边距 */
        }

        /* 控制按钮 */
        .controls {
            margin-top: 10px;
            text-align: center;
        }

        .controls button {
            margin: 0 10px;
            padding: 5px 15px;
        }

        /* 主要内容区布局 */
        .main-content {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        /* 分数变化样式 */
        .score-change {
            color: #ffeb3b;
            font-weight: bold;
            margin-left: 10px;
        }

        .score-change.positive {
            color: #4caf50;
        }

        .score-change.negative {
            color: #f44336;
        }

        /* 特殊牌型样式 */
        .special-type {
            color: #ffd700;
            font-weight: bold;
            margin-left: 10px;
        }

        /* 银两变化样式 */
        .deposit-change {
            color: #00bcd4;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 搜索区域 -->
        <div class="search-area">
            <div style="position: relative; display: inline-block;">
                <input type="text" id="playerIdSearch" placeholder="玩家ID" autocomplete="off">
                <div id="playerIdDropdown" class="search-dropdown"></div>
            </div>
            <div style="position: relative; display: inline-block;">
                <input type="text" id="roomIdSearch" placeholder="房间ID" autocomplete="off">
                <div id="roomIdDropdown" class="search-dropdown"></div>
            </div>
            <div style="position: relative; display: inline-block;">
                <input type="text" id="tableNoSearch" placeholder="桌子号" autocomplete="off">
                <div id="tableNoDropdown" class="search-dropdown"></div>
            </div>
            <div style="position: relative; display: inline-block;">
                <input type="time" id="startTimeSearch" placeholder="开始时间" step="1">
            </div>
            <div style="position: relative; display: inline-block;">
                <input type="time" id="endTimeSearch" placeholder="结束时间" step="1">
            </div>
            <button onclick="searchGame()">搜索</button>
            <button onclick="clearSearch()">清除</button>
        </div>

        <!-- 文件上传 -->
        <input type="file" id="fileInput" multiple />

        <div class="main-content">
            <!-- 游戏列表 -->
            <div class="game-list" id="gameList"></div>

            <!-- 牌桌显示 -->
            <div class="table">
                <div class="round-info">第 <span id="currentRound">0</span> 轮</div>
                <div class="player player-0">
                    <div class="player-info">
                        <div>昵称: <span class="nickname"></span></div>
                        <div>ID: <span class="player-id"></span></div>
                        <div>座位号: <span class="chair-no"></span></div>
                        <div>分数: <span class="score"></span><span class="score-change"></span><span class="special-type"></span><span class="deposit-change"></span></div>
                    </div>
                    <div class="card-area throw-cards">出牌区</div>
                    <div class="card-area hand-cards">手牌区</div>
                </div>
                <div class="player player-1">
                    <div class="player-info">
                        <div>昵称: <span class="nickname"></span></div>
                        <div>ID: <span class="player-id"></span></div>
                        <div>座位号: <span class="chair-no"></span></div>
                        <div>分数: <span class="score"></span><span class="score-change"></span><span class="special-type"></span><span class="deposit-change"></span></div>
                    </div>
                    <div class="card-area throw-cards">出牌区</div>
                    <div class="card-area hand-cards">手牌区</div>
                </div>
                <div class="player player-2">
                    <div class="player-info">
                        <div>昵称: <span class="nickname"></span></div>
                        <div>ID: <span class="player-id"></span></div>
                        <div>座位号: <span class="chair-no"></span></div>
                        <div>分数: <span class="score"></span><span class="score-change"></span><span class="special-type"></span><span class="deposit-change"></span></div>
                    </div>
                    <div class="card-area throw-cards">出牌区</div>
                    <div class="card-area hand-cards">手牌区</div>
                </div>
            </div>

            <!-- 状态列表 -->
            <div class="state-list" id="stateList"></div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button id="prevBtn" onclick="prevStep()">上一步</button>
            <button id="nextBtn" onclick="nextStep()">下一步</button>
        </div>
    </div>

    <script>
        // 存储所有游戏局的数组
        let games = [];
        // 当前显示的游戏索引
        let currentGameIndex = -1;
        // 当前步骤索引
        let currentStepIndex = -1;
        // 当前游戏的所有状态
        let gameStates = [];
        // 上一步的分数
        let previousScores = [0, 0, 0];
        // 存储当前游戏的原始日志
        let currentGameLogs = [];
        // 当前轮次
        let currentRound = 0;
        // 存储搜索选项
        let searchOptions = {
            playerIds: new Set(),
            roomIds: new Set(),
            tableNos: new Set()
        };

        // 特殊牌型映射
        const specialTypeMap = {
            1: "三顺",
            2: "全红、全黑",
            3: "大四喜",
            4: "八花齐放",
            5: "清三顺",
            6: "清一色",
            7: "一条龙",
            8: "天三顺"
        };

        // 监听文件上传事件
        document.getElementById('fileInput').addEventListener('change', function (e) {
            // 清空之前的游戏数据
            games = [];
            currentGameIndex = -1;
            currentStepIndex = -1;
            gameStates = [];
            previousScores = [0, 0, 0];
            currentGameLogs = [];
            currentRound = 0;
            searchOptions = {
                playerIds: new Set(),
                roomIds: new Set(),
                tableNos: new Set()
            };
            
            // 清空显示
            document.getElementById('gameList').innerHTML = '';
            document.getElementById('stateList').innerHTML = '';
            
            const files = e.target.files;
            let filesProcessed = 0;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function (e) {
                    const lines = e.target.result.split(/\r?\n/);
                    processLogFile(lines);
                    filesProcessed++;
                    
                    if (filesProcessed === files.length) {
                        updateSearchOptions();
                        updateGameList();
                        // 自动选择第一局游戏
                        if (games.length > 0) {
                            selectGame(0);
                        }
                    }
                };
                reader.readAsText(file, 'GB2312');
            }
        });

        // 更新搜索选项
        function updateSearchOptions() {
            games.forEach(game => {
                Object.values(game.title.Players).forEach(playerId => {
                    searchOptions.playerIds.add(playerId);
                });
                searchOptions.roomIds.add(game.title.RoomID);
                searchOptions.tableNos.add(game.title.TableNO);
            });
        }

        // 设置搜索框事件监听
        ['playerId', 'roomId', 'tableNo'].forEach(type => {
            const input = document.getElementById(`${type}Search`);
            const dropdown = document.getElementById(`${type}Dropdown`);
            
            input.addEventListener('input', () => {
                const value = input.value.toLowerCase();
                const options = Array.from(searchOptions[type + 's']);
                const filtered = options.filter(option => 
                    option.toLowerCase().includes(value)
                );
                
                dropdown.innerHTML = '';
                filtered.forEach(option => {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.textContent = option;
                    item.onclick = () => {
                        input.value = option;
                        dropdown.classList.remove('show');
                    };
                    dropdown.appendChild(item);
                });
                
                if (filtered.length > 0 && value) {
                    dropdown.classList.add('show');
                } else {
                    dropdown.classList.remove('show');
                }
            });

            // 点击外部关闭下拉框
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        });

        // 更新游戏列表显示
        function updateGameList() {
            const gameList = document.getElementById('gameList');
            gameList.innerHTML = '';
            
            games.forEach((game, index) => {
                const gameItem = document.createElement('div');
                gameItem.className = 'game-item';
                gameItem.innerHTML = `
                    <div>时间: ${game.title.Timestamp}</div>
                    <div>房间号: ${game.title.RoomID}</div>
                    <div>桌号: ${game.title.TableNO}</div>
                    <div>玩家: ${Object.values(game.title.Players).join(', ')}</div>
                `;
                gameItem.onclick = () => selectGame(index);
                gameList.appendChild(gameItem);
            });
        }

        // 选择游戏
        function selectGame(index) {
            currentGameIndex = index;
            currentGameLogs = games[index].details;
            initializeGameStates(games[index]);
            currentStepIndex = 0;
            previousScores = [0, 0, 0];
            currentRound = 0;
            updateTableDisplay();
            updatePlayerInfo(games[index].title);
            updateStateList();
        }

        // 更新状态列表
        function updateStateList() {
            const stateList = document.getElementById('stateList');
            stateList.innerHTML = '';
            
            currentGameLogs.forEach((log, index) => {
                const stateItem = document.createElement('div');
                stateItem.className = `state-item ${index === currentStepIndex ? 'active' : ''}`;
                
                let description = '';
                if (log.startsWith('Deal')) {
                    const [, chairNO] = log.split(' ');
                    description = `玩家${chairNO}摸牌`;
                } else if (log.startsWith('Throw')) {
                    const [, chairNO, cards] = log.split(' ');
                    description = `玩家${chairNO}出牌`;
                } else if (log.startsWith('RoundDiff')) {
                    const [, round, chairfrom, chairto, base] = log.split(' ');
                    description = `玩家${chairfrom} --${base}分--> 玩家${chairto} `;
                } else if (log.startsWith('SpecialDiff')) {
                    const [, chairfrom, chairto, specialcardtype, score] = log.split(' ');
                    if(chairfrom === "-1") {
                        description = `玩家${chairto}特殊牌型[${specialTypeMap[specialcardtype]}] ${score}分`;
                    } else {
                        description = `[${specialTypeMap[specialcardtype]}]:玩家${chairfrom} --${score}分--> 玩家${chairto}`;
                    }
                } else if (log.startsWith('DepositDiff')) {
                    const [, chairNO, diff, base] = log.split(' ');
                    description = `玩家${chairNO}银两: ${diff > 0 ? "+" : ""}${diff}`;
                }
                
                if (description) {
                    stateItem.innerHTML = `<div>step ${index + 1}: ${description}</div>`;
                    stateItem.onclick = () => {
                        currentStepIndex = index;
                        updateTableDisplay();
                        updateStateList();
                    };
                    stateList.appendChild(stateItem);
                }
            });
            
            // 滚动到当前状态
            const activeItem = stateList.querySelector('.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 更新玩家信息显示
        function updatePlayerInfo(gameTitle) {
            for(let i = 0; i < 3; i++) {
                const playerInfo = document.querySelector(`.player-${i} .player-info`);
                const player = gameTitle.Players[i];
                const playerName = gameTitle.PlayerNames[i];
                if(player) {
                    playerInfo.querySelector('.player-id').textContent = player;
                    playerInfo.querySelector('.nickname').textContent = playerName;
                    playerInfo.querySelector('.chair-no').textContent = i;
                }
            }
        }

        // 处理日志文件
        function processLogFile(lines) {
            let currentGame = [];
            let gameTitle = {};

            lines.forEach(line => {
                if (line.startsWith('Version')) {
                    if (currentGame.length > 0) {
                        games.push({ title: gameTitle, details: currentGame });
                        currentGame = [];
                        gameTitle = {};
                    }
                } else if (line.startsWith('Timestamp')) {
                    gameTitle.Timestamp = timestampToDateTime(line.split(' ')[1]);
                } else if (line.startsWith('RoomID')) {
                    gameTitle.RoomID = line.split(' ')[1];
                } else if (line.startsWith('TableNO')) {
                    gameTitle.TableNO = line.split(' ')[1];
                } else if (line.startsWith('ChairNO')) {
                    const chairDetails = line.split(' ').slice(1);
                    const chairNO = chairDetails[0];
                    const playerID = chairDetails[1];
                    if (!gameTitle.Players) {
                        gameTitle.Players = {};
                    }
                    gameTitle.Players[chairNO] = playerID;
                } else if (line.startsWith('Name')) {
                    const nameDetails = line.split(' ').slice(1);
                    const chairNO = nameDetails[0];
                    const playerName = nameDetails[1];
                    if (!gameTitle.PlayerNames) {
                        gameTitle.PlayerNames = {};
                    }
                    gameTitle.PlayerNames[chairNO] = playerName;
                } else {
                    const trimmedLine = line.replace(/^[\d:]+ /, '').trim();
                    if (trimmedLine.startsWith('Raw')) {
                        currentGame.push(trimmedLine.replace('Raw', ''));
                    }
                }
            });

            if (currentGame.length > 0) {
                games.push({ title: gameTitle, details: currentGame });
            }
        }

        // 搜索游戏
        function searchGame() {
            const playerId = document.getElementById('playerIdSearch').value;
            const roomId = document.getElementById('roomIdSearch').value;
            const tableNo = document.getElementById('tableNoSearch').value;
            const startTime = document.getElementById('startTimeSearch').value;
            const endTime = document.getElementById('endTimeSearch').value;

            const gameList = document.getElementById('gameList');
            gameList.innerHTML = '';
            
            // 如果所有搜索框都为空，显示所有游戏
            if (!playerId && !roomId && !tableNo && !startTime && !endTime) {
                updateGameList();
                return;
            }

            const firstGameDate = games.length > 0 ? new Date(games[0].title.Timestamp) : new Date();
            const year = firstGameDate.getFullYear();
            const month = firstGameDate.getMonth();
            const day = firstGameDate.getDate();

            const filteredGames = games.filter(game => {
                const matchPlayerId = !playerId || Object.values(game.title.Players).includes(playerId);
                const matchRoomId = !roomId || game.title.RoomID === roomId;
                const matchTableNo = !tableNo || game.title.TableNO === tableNo;
                
                let matchTime = true;
                const gameTime = new Date(game.title.Timestamp);
                if (startTime) {
                    const [hours, minutes, seconds] = startTime.split(':');
                    const startDateTime = new Date(year, month, day, hours, minutes, seconds);
                    matchTime = matchTime && gameTime >= startDateTime;
                }
                if (endTime) {
                    const [hours, minutes, seconds] = endTime.split(':');
                    const endDateTime = new Date(year, month, day, hours, minutes, seconds);
                    matchTime = matchTime && gameTime <= endDateTime;
                }
                
                return matchPlayerId && matchRoomId && matchTableNo && matchTime;
            });
            
            filteredGames.forEach((game, index) => {
                const gameItem = document.createElement('div');
                gameItem.className = 'game-item';
                gameItem.innerHTML = `
                    <div>时间: ${game.title.Timestamp}</div>
                    <div>房间号: ${game.title.RoomID}</div>
                    <div>桌号: ${game.title.TableNO}</div>
                    <div>玩家: ${Object.values(game.title.Players).join(', ')}</div>
                `;
                gameItem.onclick = () => selectGame(games.indexOf(game));
                gameList.appendChild(gameItem);
            });
        }

        // 清除搜索
        function clearSearch() {
            document.getElementById('playerIdSearch').value = '';
            document.getElementById('roomIdSearch').value = '';
            document.getElementById('tableNoSearch').value = '';
            document.getElementById('startTimeSearch').value = '';
            document.getElementById('endTimeSearch').value = '';
            updateGameList();
        }

        // 初始化游戏状态
        function initializeGameStates(game) {
            gameStates = [];
            let currentState = {
                handCards: [[],[],[]],
                throwCards: [[],[],[]],
                scores: [0,0,0],
                special: [0,0,0],
                specialscore: [0,0,0],
                depositdiff: [0,0,0],
                round: 0
            };

            game.details.forEach(logLine => {
                let newState = JSON.parse(JSON.stringify(currentState));
                
                if (logLine.startsWith('Deal')) {
                    const [, chairNO, ...cards] = logLine.split(' ');
                    if(chairNO == 0) {
                        newState.round++;
                    }
                    newState.handCards[Number(chairNO)] = cards[0].split(',');
                } else if (logLine.startsWith('Throw')) {
                    const [, chairNO, cards] = logLine.split(' ');
                    const cardArray = cards.split(',');
                    const chair = Number(chairNO);
                    newState.throwCards[chair] = newState.throwCards[chair].concat(cardArray);
                    newState.handCards[chair] = newState.handCards[chair].filter(
                        card => !cardArray.includes(card)
                    );
                } else if (logLine.startsWith('RoundDiff')) {
                    const [, round, chairfrom, chairto, base, diansha] = logLine.split(' ');
                    newState.scores[Number(chairfrom)] -= Number(base);
                    newState.scores[Number(chairto)] += Number(base);
                } else if (logLine.startsWith('SpecialDiff')) {
                    const [, chairfrom, chairto, specialcardtype, score] = logLine.split(' ');
                    if(chairfrom === "-1") {
                        newState.specialscore[Number(chairto)] += Number(score);
                    } else {
                        newState.specialscore[Number(chairfrom)] -= Number(score);
                        newState.specialscore[Number(chairto)] += Number(score);
                    }
                    newState.special[Number(chairto)] = specialcardtype;
                } else if (logLine.startsWith('DepositDiff')) {
                    const [, chairNO, diff, base] = logLine.split(' ');
                    newState.depositdiff[Number(chairNO)] = Number(diff);
                }

                currentState = newState;
                gameStates.push(JSON.parse(JSON.stringify(newState)));
            });
        }

        // 更新牌桌显示
        function updateTableDisplay() {
            if (currentStepIndex < 0 || !gameStates[currentStepIndex]) return;

            const state = gameStates[currentStepIndex];
            
            // 更新轮次显示
            document.getElementById('currentRound').textContent = state.round;
            
            for (let i = 0; i < 3; i++) {
                const handCardsDiv = document.querySelector(`.player-${i} .hand-cards`);
                const throwCardsDiv = document.querySelector(`.player-${i} .throw-cards`);
                const scoreChangeSpan = document.querySelector(`.player-${i} .score-change`);
                const specialTypeSpan = document.querySelector(`.player-${i} .special-type`);
                const depositChangeSpan = document.querySelector(`.player-${i} .deposit-change`);
                
                handCardsDiv.innerHTML = '手牌区: ' + generateCardImages(state.handCards[i]);
                throwCardsDiv.innerHTML = '出牌区: ' + generateCardImages(state.throwCards[i]);
                
                // 更新分数显示和分数变化
                document.querySelector(`.player-${i} .score`).textContent = state.scores[i];
                const scoreDiff = state.scores[i] - previousScores[i];
                if (scoreDiff !== 0) {
                    scoreChangeSpan.textContent = scoreDiff > 0 ? ` (+${scoreDiff})` : ` (${scoreDiff})`;
                    scoreChangeSpan.className = `score-change ${scoreDiff > 0 ? 'positive' : 'negative'}`;
                } else {
                    scoreChangeSpan.textContent = '';
                }

                // 更新特殊牌型显示和特殊分数
                if (state.special[i] > 0) {
                    specialTypeSpan.textContent = ` [${specialTypeMap[state.special[i]]}]`;
                    if (state.specialscore[i] !== 0) {
                        specialTypeSpan.textContent += ` (${state.specialscore[i] > 0 ? '+' : ''}${state.specialscore[i]})`;
                    }
                } else {
                    specialTypeSpan.textContent = '';
                }

                // 更新银两变化显示
                if (state.depositdiff[i] !== 0) {
                    depositChangeSpan.textContent = ` 银两: ${state.depositdiff[i] > 0 ? '+' : ''}${state.depositdiff[i]}`;
                } else {
                    depositChangeSpan.textContent = '';
                }
            }
            previousScores = [...state.scores];
            updateStateList();
        }

        // 上一步
        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateTableDisplay();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStepIndex < gameStates.length - 1) {
                currentStepIndex++;
                updateTableDisplay();
            }
        }

        // 生成卡牌图片HTML
        function generateCardImages(cardIds) {
            return cardIds.map(cardId => {
                const paddedId = cardId.padStart(2, '0');
                return `<img src="skin/card_${paddedId}.png" alt="${paddedId}">`;
            }).join('');
        }

        // 时间戳转换为日期时间字符串
        function timestampToDateTime(timestamp) {
            const date = new Date(timestamp * 1000);
            const pad = num => String(num).padStart(2, '0');
            
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
                   `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }
    </script>
</body>

</html>
